# Relay Policy Tracker — relevance gates + impact scoring rubric
# Portable spec, same two-step shape as grant-finder scoring.yaml: GATES first, then a
# weighted score mapped to a recommendation. Applied by the Claude judgment layer inside
# the /relay-policy command. Calibrated by config/relay-profile facts (grant-finder's copy
# is authoritative; this tool reads ../relay-grant-finder/config/relay-profile.yaml).

meta:
  updated: "2026-08-05"
  principle: "A loud headline must never mask a jurisdiction, stage, or relevance miss; a quiet rule change in a core topic outranks a national think-piece."
  verify_rule: "Bill stage, latest action, effective dates, and comment deadlines come from the PRIMARY source (legislature site, register page) every run — never from a press summary. COMMENTARY items are reported as 'per <outlet>', never as fact."

signal_classes:
  LEGISLATION: "A bill or resolution in Congress or a state legislature."
  REGULATION:  "A proposed/final rule or register notice from ED or a state agency/board."
  AGENCY:      "Official non-rule signals: board agendas, commissioner memos, guidance, budget proposals, press releases."
  COMMENTARY:  "Secondary sources: think tanks, advocacy, ed press. Context and early warning only."

# ── STEP 1: RELEVANCE GATES ── any fail => ARCHIVE (logged, not surfaced). No score computed.
gates:
  - id: jurisdiction
    rule: "Federal, or one of Relay's authorized jurisdictions (CO, CT, DE, GA, IL, NJ, NY, PA, RI, TN, TX, DC, IN; CA = pending_watch, surfaces at SCAN max). Other states only via COMMENTARY when a national trend."
  - id: topic_floor
    rule: "Matches >=1 taxonomy topic (config/topics.yaml). Context-tier-only matches cap at SCAN unless momentum is exceptional."
  - id: liveness
    rule: "LEGISLATION: current session and not dead (adjourned-without-action = ARCHIVE with a one-line note if core-tier). REGULATION: comment window open, pending finalization, or effective date in the future. COMMENTARY older than 30 days: ARCHIVE."
  - id: dedup_cluster
    rule: "Same underlying policy event across sources (a bill + its press coverage + a think-tank take) clusters into ONE surfaced item; the primary source leads, secondaries attach as 'coverage'."

# ── STEP 2: IMPACT SCORE ── dimensions 0-5; weights sum to 100.
# final = sum(weight_i * score_i / 5), no confidence penalty — instead, unverifiable stage/
# deadline facts get 'UNVERIFIED' labels and cap the rec at TRACK (never ACT on unverified).
dimensions:
  - { id: relay_surface,     weight: 30, anchor5: "Directly regulates Relay's operations: EPP approval/accountability, cert/licensure rules, residency/apprenticeship funding, Title II, program-approval standards" }
  - { id: momentum,          weight: 20, anchor5: "Enacted/final, or passed a chamber / final-rule stage imminent; 0-1 = introduced-and-parked, think-piece" }
  - { id: jurisdiction_depth,weight: 15, anchor5: "Federal with direct effect, or a state where Relay has deep partnerships (NY, NJ, TX, TN, IL); 2-3 = other authorized states; 1 = CA watch / national trend" }
  - { id: ecosystem_reach,   weight: 15, anchor5: "Reshapes funding or staffing across many districts Relay serves (formula rewrite, class-size mandate, salary floor)" }
  - { id: actionability,     weight: 10, anchor5: "Relay can respond NOW: open comment period, testimony window, program-design opportunity, partnership angle" }
  - { id: signal_quality,    weight: 10, anchor5: "Primary source verified this run; 0-1 = single secondary source, unconfirmed" }

# ── RECOMMENDATION MAPPING ──
recommendations:
  - { min: 70, rec: ACT,     meaning: "Direct Relay impact with an open response window — surface at top with the deadline and a suggested next step." }
  - { min: 50, rec: TRACK,   meaning: "Moving and plausibly impactful — follows in the digest with stage + next expected event." }
  - { min: 30, rec: SCAN,    meaning: "Context worth one line (vibes lane)." }
  - { min: 0,  rec: ARCHIVE, meaning: "Logged in the ledger; not surfaced." }
overrides:
  - "Any failed gate => ARCHIVE (name the gate)."
  - "UNVERIFIED stage or deadline => cap at TRACK; say what's unverified. A near-term deadline that is unverified is itself an action item: verify it FIRST this run, don't just cap and move on."
  - "COMMENTARY alone can never exceed SCAN — but COMMENTARY that cites an untracked primary document (a new rule, waiver, memo, bill) is a DISCOVERY LEAD: fetch the cited primary during judgment; if confirmed, the item enters as that primary's signal class with the outlet attached as coverage. Never let the SCAN ceiling bury a lead to a primary source."
  - "A VERIFIED open comment/response window <=15 business days on a core-tier item => floor of ACT (raised from TRACK, 2026-08-05 cross-family critique: urgency plus direct relevance is exactly what ACT exists for). Adjacent-tier verified windows floor TRACK."
  - "Overload partition (budget-season runs): when candidates exceed what one session can judge, process core tier first, then adjacent by jurisdiction depth (NY, NJ, TX, TN, IL first), and REPORT what was deferred — silent truncation is prohibited."

# ── OUTPUT FIELDS (per surfaced item) ──
output_fields:
  what_it_does: >-
    Memo-grade summary, 2-6 sentences scaled to impact: the MECHANISM (what it funds,
    bars, requires, repeals, enables, defunds), WHO is affected, dollar amounts and
    effective dates when stated, and any carve-outs. ACT/TRACK items get the full
    treatment; SCAN items 1-2 sentences. Written to be lifted verbatim into a daily or
    weekly memo (runner/compose_memo.py), so it must stand alone without the dashboard.
  relay_angle: "One line: why Relay specifically should care (or 'ecosystem-level only')."
  relay_implications: >-
    For ACT/TRACK items: a short typed list derived from what_it_does + relay-profile
    facts, each entry {type: funding|compliance|program|partnership|advocacy|risk,
    text: one concrete operational implication}. Omit types with nothing real to say —
    an empty list on a SCAN item is correct, a padded list is not. Row field:
    `implications`.
  legislative: >-
    LEGISLATION items: sponsors, origin chamber, committee, and roll-call vote tallies
    come ONLY from runner/billdetail.py's cache (state/bill-detail.json, attached to
    rows as `legislative` via --attach). API-sourced = citable; never hand-author this
    block, never fill gaps from memory — a bill without detail simply has no block.
  text_analysis: >-
    For ACT-lane LEGISLATION items (and any bill where change-direction matters):
    a section-level read of what the bill text actually changes, sourced from
    runner/billtext.py output (state/bill-texts/<id>/excerpt.md — amendment markup
    preserved as <<+added+>>/<<-deleted->> where the state serves HTML). Row field:
    `text_analysis`, an object {doc, read_date, scope, findings} where findings is a
    list of {section, cite, change, direction: expands|restricts|neutral|procedural,
    relay_relevance}. `scope` states honestly what was read (e.g. "topic-relevant
    sections only, N of M") — a partial read is fine, an unscoped claim is not.
    Direction verdicts come ONLY from marked additions/deletions or explicit
    amendatory language, never inferred from a synopsis. This is the field that
    retires "direction not yet established" caveats — write it when the text has
    been read, and only then.
  leader_brief: >-
    Plain-language briefing for senior leaders who are not policy specialists. Authored
    for every ACT item and for TRACK items that are NEW, UPDATED, or moved this run;
    carried forward unchanged on later runs until the underlying facts change. Row
    field: `leader_brief`, an object {headline, summary, implications, questions}.
    `headline` (optional) is a plain-language retitle used as the briefing heading when
    the board title leans on jargon (bill numbers stay; "omnibus"/"enrolled"/"Calendar
    No." go). `summary`
    (2-4 sentences) says what happened and where it stands in everyday words: spell
    out every acronym on first use, translate procedural jargon ("enrolled" -> "passed
    both chambers, now on the Governor's desk"), no statute citations, no assumed
    policy background. `implications` (1-3 sentences of prose — distinct from the
    typed `implications` list) says what it could mean for Relay in operational terms.
    `questions` (1-3 strings) are the questions the item invites leadership to
    consider — strategy, risk, resourcing, timing decisions that are theirs to make —
    never reading-comprehension restatements. Same no-fabrication rule as every other
    field: the brief restates only facts verified this run; it introduces no new
    entities, numbers, or dates.
  stage_line: "Where it is + next expected event + date, verified from primary."
  response_window: "Comment deadline / hearing date / effective date if any, with business-days-out."
  coverage: "Clustered secondary sources, each as 'per <outlet>' with link."

# ── DIGEST STRUCTURE (consumed by the /relay-policy command) ──
digest_lanes:
  - "ACT — needs a decision or response (full entries)"
  - "TRACK — moving legislation & rulemaking, grouped by jurisdiction (compact entries)"
  - "SCAN — the vibes lane: agency signals + commentary one-liners, grouped Federal then states"
  - "MOVEMENT — items whose stage changed since last run (auto from ledger UPDATED status)"
  - "ARCHIVE count + audit-file pointer (never render the list)"

tuning:
  note: "This rubric is the tunable core. Revisit weights against operator feedback on the first three digests; log changes with date + rationale."
  changelog:
    - "2026-08-05 initial rubric (built during autonomous v1 session)."
    - "2026-08-05 cross-family critique pass (GPT-5.6-sol + Gemini 3.6 Flash, convergent findings): verified core window <=15bd now floors ACT; commentary-as-discovery-lead rule; overload partition rule; near-deadline unverified = verify-first. Pipeline-side same day: LegiScan change_hash folded into movement hash (catches committee substitutes); getSearch full-text leg (catches cert provisions in generically-titled bills); deadline-window re-surfacing of unchanged items; per-source zero-yield health warnings."
    - "2026-08-07 usability pass (operator-directed): what_it_does formalized as memo-grade (mechanism verbs, affected parties, amounts); relay_implications typed list added; legislative metadata block (sponsors/chamber/committee/votes) sourced exclusively from runner/billdetail.py — verified-only, never authored. Memo compiler (runner/compose_memo.py) added downstream."
    - "2026-08-11 leadership layer (operator-directed): leader_brief field added — plain-language summary + prose implications + questions for consideration, authored for ACT items and fresh/moved TRACK items, rendered by compose_memo.py --mode leaders into a standalone leadership briefing."
    - "2026-08-11 text deep-read (operator-directed, same day): runner/billtext.py fetches actual bill text (LegiScan getBillText / GovInfo), preserves amendment markup, segments sections, emits topic-filtered judgment excerpts; text_analysis field added for section-level change-direction verdicts. First use: IL HB5552 enrolled text — resolved the open loosening-vs-tightening question."
